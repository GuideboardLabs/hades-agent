[package]
name = "harness"
version = "0.1.16"
edition = "2024"
description = "The Hades harness: one turn of the loop, typed, with the model behind a seam."
license = "MIT"

[[bin]]
name = "hades"
path = "src/main.rs"

[dependencies]
# The log is the session tree, which is already a port with a spec behind it.
session-tree = { path = "../session-tree" }
# Memory is Mneme, and the audit is the engine's first use of governance.
mneme = { path = "../mneme" }
governance = { path = "../governance" }
# Entry payloads are JSON, which is the format the session tree already writes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
unicode-width = "0.2"
# The Landlock syscalls, with the per-architecture numbers libc already knows. The cage used raw x86-64
# assembly, which is why the crate did not compile on ARM64 at all.
libc = "0.2"

[dev-dependencies]
libc = "0.2"
