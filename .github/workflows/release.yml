name: release

# The release used to be a sequence of commands someone remembered on their own machine, which is how the
# binary came to require the build host's glibc and how the README came to advertise the previous version.
# Everything here is a script in the repository: this file orders them and refuses to publish if any of them
# says no. The floor assertion is the part that matters: a build on a newer runner fails the job instead of
# silently shipping a binary that refuses the previous LTS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: The version the docs claim is the version in the manifest
        run: bash rust/scripts/check-claims.sh
      - name: Formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The host this gate ran on
        working-directory: rust
        run: |
          cargo run -q -p harness --bin hades -- doctor 2>/dev/null \
            | grep -E "platform|libc|landlock|sqlite|tar |fetch transport|compatibility" \
            | sed 's/^[[:space:]]*//' | head -8 | while IFS= read -r line; do
                echo "::notice::$line"
              done || true
      - name: Tests
        working-directory: rust
        run: bash scripts/ci-test.sh
      - name: The test count the docs claim is the count that ran
        run: bash rust/scripts/check-claims.sh --tests "$(cat rust/.test-count)"

  arm64:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl
      # Neither build is a container job: the cross toolchains and qemu are staged under the cache with
      # `apt-get download` and `dpkg-deb -x`, because registering binfmt needs root the runner does not give us.
      # The artifacts are *run* here, not only compiled: version, doctor, init, pack add and audit under
      # qemu-aarch64, with `--require` so a missing emulator fails the job instead of skipping it.
      # musl.cc is not reachable from GitHub-hosted runners (the connection times out). Zig ships an
      # aarch64-linux-musl C compiler and libc, installs from PyPI, and is the fallback `arm64-build.sh`
      # uses when no staged musl toolchain is present. It is a fallback, not a requirement: a machine with
      # the musl.cc toolchain already staged does not download it.
      - name: Provide a reachable musl C compiler
        run: python3 -m pip install --quiet --disable-pip-version-check ziglang
      - name: Build and run ARM64 artifacts
        run: |
          set +e
          bash rust/scripts/arm64-build.sh --out dist 2>&1 | tee /tmp/arm64-build.log
          status=${PIPESTATUS[0]}
          exit "$status"
      # A failed job's log is not readable without admin rights, which makes a red X on a public release
      # undiagnosable. When the build fails, its own output is attached as an artifact instead.
      - name: Keep the ARM64 build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-log
          path: /tmp/arm64-build.log
          if-no-files-found: warn
      # An artifact needs a download; an annotation is readable through the public API. The last lines of a
      # failed step are otherwise invisible on a public repository without admin rights.
      - name: Name the ARM64 failure
        if: failure()
        run: |
          message=$(tail -5 /tmp/arm64-build.log 2>/dev/null | tr '\n' ' ' | cut -c1-900)
          echo "::error title=ARM64 build failed::${message:-no build log was written}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-arm64
          path: |
            dist/hades-arm64-gnu
            dist/hades-arm64-musl
          if-no-files-found: error

  artifacts:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both builds run in the image they target, exactly as they do locally. A container job cannot nest a
      # second container, and `actions/checkout` has no musl build, so the container is driven from the runner.
      - name: Build for glibc 2.30
        run: bash rust/scripts/portable-build.sh --flavour gnu --out dist
      - name: Build the static musl binary
        run: bash rust/scripts/portable-build.sh --flavour musl --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/hades-portable
            dist/hades-musl
          if-no-files-found: error

  verify:
    needs: [artifacts, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both artifact sets, merged: the four binaries are verified from the bytes that will be published,
      # not from the build directory they were copied out of.
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: dist
      # upload-artifact drops the mode; a downloaded binary arrives 0644 and cannot be executed or packaged.
      - name: Restore executable bits
        run: chmod 755 dist/hades-portable dist/hades-musl dist/hades-arm64-gnu dist/hades-arm64-musl
      - name: The ARM64 artifacts, run rather than cross-checked
        run: |
          bash rust/scripts/arm64-check.sh dist/hades-arm64-gnu --require
          bash rust/scripts/arm64-check.sh dist/hades-arm64-musl --require
      - name: The portable binary on three LTS images
        run: bash rust/scripts/portability.sh dist/hades-portable
      - name: The static binary on the same three images
        run: bash rust/scripts/portability.sh dist/hades-musl
      - name: Acceptance, portable
        run: bash rust/acceptance/clean-home.sh --bin dist/hades-portable
      - name: Acceptance, static
        run: bash rust/acceptance/clean-home.sh --bin dist/hades-musl
      - name: Faults, portable
        run: bash rust/scripts/fault-injection.sh dist/hades-portable
      - name: Faults, static
        run: bash rust/scripts/fault-injection.sh dist/hades-musl
      - name: The static binary on the distribution it was built for
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD/dist:/b:ro" alpine:3.20 sh -c '
            apk add --no-cache curl tar >/dev/null
            export HOME=/tmp
            /b/hades-musl init --provider ollama-cloud --model qwen3.8-27b --root /tmp/work >/dev/null
            /b/hades-musl pack add review-a-diff --yes | tail -1
            /b/hades-musl doctor | grep -E "libc|compatibility"'

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: dist
      - name: Restore executable bits
        run: chmod 755 dist/hades-portable dist/hades-musl dist/hades-arm64-gnu dist/hades-arm64-musl
      - name: Package both artifacts
        run: |
          bash rust/package.sh --skip-build --bin dist/hades-portable --out dist
          bash rust/package.sh --skip-build --bin dist/hades-musl \
            --target x86_64-unknown-linux-musl --out dist
          bash rust/package.sh --skip-build --bin dist/hades-arm64-gnu \
            --target aarch64-unknown-linux-gnu --out dist
          bash rust/package.sh --skip-build --bin dist/hades-arm64-musl \
            --target aarch64-unknown-linux-musl --out dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          bash rust/scripts/release-notes.sh "${tag#v}" > /tmp/notes.md
          gh release create "$tag" \
            --title "hades $tag" \
            --notes-file /tmp/notes.md \
            dist/hades-*.tar.gz \
            dist/hades-*.tar.gz.sha256
