name: pack-contract

# A pack depends on a released tag, not on this repository's working tree. The cost of that
# independence is that a change here can break a pack silently: base would go green, the tag would
# ship, and the pack would fail to build for whoever touched it next. This job closes that gap by
# building the packs repository against this checkout with only the `harness` dependency rewritten.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pack-contract-${{ hashFiles('rust/Cargo.lock', 'rust/harness/**') }}

      - name: Fetch the packs repository
        run: git clone --depth 1 https://github.com/GuideboardLabs/hades-agent-packs "$RUNNER_TEMP/hades-packs"

      - name: Build and test every connector pack against this checkout
        run: bash rust/scripts/pack-contract.sh --packs-dir "$RUNNER_TEMP/hades-packs"
